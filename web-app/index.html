<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional Peg Solitaire</title>
    
    <!-- Tailwind for base layout and styling -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    
    <!-- Link to separated CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <h1 class="text-3xl font-bold text-gray-800 tracking-wide">Peg Solitaire</h1>
        <div id="board-root"></div>
        <div id="status-root" class="h-8 text-lg font-medium text-gray-600"></div>
        <button id="reset-btn" class="px-6 py-2 bg-gray-800 text-white font-semibold rounded-lg shadow-md hover:bg-gray-700 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-opacity-75">
            Restart Game
        </button>
    </div>

    <!-- Main Entry Point -->
    <script type="module" src="main.js"></script>
</body>
</html>
